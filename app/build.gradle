plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Optional stable release signing. Set these (CI decodes a base64 keystore secret into a file
// and exports them) to sign with a fixed key. Without them — e.g. local dev — the release build
// falls back to the auto-generated debug key so it stays buildable and sideloadable.
def releaseKeystore = System.getenv("KEYSTORE_FILE")

android {
    namespace = "com.example.bleat"
    compileSdk = 36
    buildToolsVersion = "36.1.0"
    defaultConfig {
        applicationId = "com.example.bleat"
        minSdk = 36
        targetSdk = 36
        versionCode = 1
        versionName = "1.0"
    }
    buildFeatures {
        compose = true
    }
    signingConfigs {
        if (releaseKeystore != null) {
            release {
                storeFile = file(releaseKeystore)
                storePassword = System.getenv("KEYSTORE_PASSWORD")
                keyAlias = System.getenv("KEY_ALIAS")
                keyPassword = System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            // Stable release key when configured (CI secret), otherwise the debug key so a local
            // `assembleRelease` still produces a sideloadable APK with zero setup.
            signingConfig = releaseKeystore != null ? signingConfigs.getByName("release")
                                                     : signingConfigs.getByName("debug")
            // R8 code + resource shrinking. Verify the BLE flow on-device after any keep-rule
            // change (this app has no reflection/serialization, so the risk is low).
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
kotlin {
    jvmToolchain(25)
}
dependencies {
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.compose.ui:ui:1.7.6"
    implementation "androidx.compose.material3:material3:1.3.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
}
