name: CI

# Lint, unit tests and a debug APK on every push / pull request so breakages are caught early.
# Release APKs are produced by release.yml (on tags / manual run).

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      # Dependency/build caching and Gradle wrapper checksum validation.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # compileSdk 37 needs platforms;android-37.0, and AGP builds with build-tools 36.0.0
      # (its default, not the newest published). AGP would fetch both mid-build; installing them
      # up front keeps the download out of the Gradle run and pins what CI compiles against.
      - name: Install SDK packages (API 37 + build-tools 36.0.0)
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Lint, unit tests, debug APK
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
