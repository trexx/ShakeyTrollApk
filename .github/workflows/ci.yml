name: CI

# Fast build check on every push / pull request: compiles and assembles the debug APK so
# breakages are caught early. Release APKs are produced by release.yml (on tags / manual run).

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      # compileSdk 37 needs platforms;android-37.0, and AGP 9.3.1 builds with build-tools 36.0.0
      # (its default, not the newest published). AGP would fetch both mid-build; installing them
      # up front keeps the download out of the Gradle run and pins what CI compiles against.
      - name: Install SDK packages (API 37 + build-tools 36.0.0)
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
