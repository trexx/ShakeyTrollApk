name: Build Release APK

# Build a sideloadable release APK on demand, and on version tags (v1.0.1, v2.3.0, …).
# Tag builds take their version from the tag (see app/build.gradle). The APK is signed with the
# KEYSTORE_* secrets when they're configured and with the auto-generated debug key otherwise
# (fine for sideloading), uploaded as a workflow artifact together with the R8 mapping file,
# and — on tag builds — both are attached to the matching GitHub Release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the APK to a GitHub Release on tag builds

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # JDK 21 runs Gradle/AGP. The Java 25 toolchain (jvmToolchain(25)) is auto-provisioned
      # by the Foojay resolver plugin configured in settings.gradle.
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      # Dependency/build caching and Gradle wrapper checksum validation.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # compileSdk 37 needs platforms;android-37.0, and AGP builds with build-tools 36.0.0
      # (its default, not the newest published). AGP would fetch both mid-build; installing them
      # up front keeps the download out of the Gradle run and pins what CI compiles against.
      - name: Install SDK packages (API 37 + build-tools 36.0.0)
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      # If a stable signing key is configured (repo secrets), decode it; otherwise the build
      # falls back to the debug key (see app/build.gradle).
      - name: Decode release keystore (if configured)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          fi

      # v1.2.3 -> versionName 1.2.3, versionCode 10203 (app/build.gradle). Manual runs keep the
      # dev fallback version.
      - name: Derive version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Unit tests + release APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sleepytroll-connect-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # R8 obfuscates the release build; keep the mapping so crash traces can be read back.
      - name: Upload R8 mapping artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sleepytroll-connect-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      # Tag builds also publish the APK on the matching GitHub Release. `gh` is preinstalled on
      # the runner, so this needs no extra action; re-running a tag build replaces the asset.
      - name: Attach APK and mapping to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(app/build/outputs/apk/release/*.apk app/build/outputs/mapping/release/mapping.txt)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
