plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Optional stable release signing. Set these (CI decodes a base64 keystore secret into a file
// and exports them) to sign with a fixed key. Without them — e.g. local dev — the release build
// falls back to the auto-generated debug key so it stays buildable and sideloadable.
// Empty (not just unset): in CI the keystore step leaves KEYSTORE_FILE="" when no signing
// secret is configured, so trim to "" and rely on Groovy truthiness below to treat it as absent.
def releaseKeystore = System.getenv("KEYSTORE_FILE")?.trim()

android {
    namespace = "com.example.bleat"
    compileSdk = 37
    defaultConfig {
        applicationId = "com.example.bleat"
        minSdk = 36
        targetSdk = 36
        versionCode = 1
        versionName = "1.0"
    }
    buildFeatures {
        compose = true
    }
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile = file(releaseKeystore)
                storePassword = System.getenv("KEYSTORE_PASSWORD")
                keyAlias = System.getenv("KEY_ALIAS")
                keyPassword = System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            // Stable release key when configured (CI secret), otherwise the debug key so a local
            // `assembleRelease` still produces a sideloadable APK with zero setup.
            signingConfig = releaseKeystore ? signingConfigs.getByName("release")
                                            : signingConfigs.getByName("debug")
            // R8 code + resource shrinking. Verify the BLE flow on-device after any keep-rule
            // change (this app has no reflection/serialization, so the risk is low).
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
kotlin {
    jvmToolchain(25)
}
dependencies {
    implementation platform("androidx.compose:compose-bom:2026.06.01")
    implementation "androidx.core:core-ktx:1.19.0"
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.11.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
}
