name: Build Release APK

# Build a sideloadable release APK on demand, and on version tags (v1.0, v2.3, …).
# The APK is signed with the KEYSTORE_* secrets when they're configured and with the
# auto-generated debug key otherwise (fine for sideloading), uploaded as a workflow artifact,
# and — on tag builds — attached to the matching GitHub Release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the APK to a GitHub Release on tag builds

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # JDK 21 runs Gradle/AGP. The Java 25 toolchain (jvmToolchain(25)) is auto-provisioned
      # by the Foojay resolver plugin configured in settings.gradle.
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      # compileSdk 37 needs platforms;android-37.0, and AGP 9.3.1 builds with build-tools 36.0.0
      # (its default, not the newest published). AGP would fetch both mid-build; installing them
      # up front keeps the download out of the Gradle run and pins what CI compiles against.
      - name: Install SDK packages (API 37 + build-tools 36.0.0)
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      # If a stable signing key is configured (repo secrets), decode it; otherwise the build
      # falls back to the debug key (see app/build.gradle).
      - name: Decode release keystore (if configured)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sleepytroll-connect-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Tag builds also publish the APK on the matching GitHub Release. `gh` is preinstalled on
      # the runner, so this needs no extra action; re-running a tag build replaces the asset.
      - name: Attach APK to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" app/build/outputs/apk/release/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/*.apk \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
