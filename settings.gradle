pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    // Supplies the download URLs that `updateDaemonJvm` writes into gradle/gradle-daemon-jvm.properties,
    // so Gradle can fetch the JDK named there on any machine that lacks it.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "ShakeyTrollApk"
include ':app'
