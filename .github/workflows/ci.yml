name: CI

# Fast build check on every push / pull request: compiles and assembles the debug APK so
# breakages are caught early. Release APKs are produced by release.yml (on tags / manual run).

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v5.5.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install SDK packages (API 36 + build-tools 36.1.0)
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
