plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Optional stable release signing. Set these (CI decodes a base64 keystore secret into a file
// and exports them) to sign with a fixed key. Without them — e.g. local dev — the release build
// falls back to the auto-generated debug key so it stays buildable and sideloadable.
// Empty (not just unset): in CI the keystore step leaves KEYSTORE_FILE="" when no signing
// secret is configured, so trim to "" and rely on Groovy truthiness below to treat it as absent.
def releaseKeystore = System.getenv("KEYSTORE_FILE")?.trim()

// Release versions come from the git tag: release.yml exports VERSION_NAME=1.2.3 for tag v1.2.3.
// Local and manual builds fall back to a dev version. Every tag up to v1.0.0 shipped with the
// hard-coded versionCode 1, so the next release tag must be >= v1.0.1 (versionCode 10001).
def releaseVersion = System.getenv("VERSION_NAME")?.trim() ?: null
def semverCode(String v) {
    def nums = v.tokenize('.').take(3).collect { part ->
        def m = (part =~ /^\d+/)
        m.find() ? m.group().toInteger() : 0
    }
    while (nums.size() < 3) nums << 0
    return nums[0] * 10000 + nums[1] * 100 + nums[2]
}

android {
    namespace = "com.trexx.shakeytroll"
    compileSdk = 37
    defaultConfig {
        applicationId = "com.trexx.shakeytroll"
        minSdk = 36
        targetSdk = 36
        versionName = releaseVersion ?: "1.0.0-dev"
        versionCode = releaseVersion ? semverCode(releaseVersion) : 1
    }
    lint {
        // CI gates on lintDebug: errors fail the build, warnings stay visible in the HTML report.
        abortOnError = true
        htmlReport = true
    }
    buildFeatures {
        compose = true
    }
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile = file(releaseKeystore)
                storePassword = System.getenv("KEYSTORE_PASSWORD")
                keyAlias = System.getenv("KEY_ALIAS")
                keyPassword = System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            // Offers the en-XA/ar-XB pseudo-locales in system Settings on debug builds, to spot
            // any user-visible string that is still hardcoded.
            pseudoLocalesEnabled = true
        }
        release {
            // Stable release key when configured (CI secret), otherwise the debug key so a local
            // `assembleRelease` still produces a sideloadable APK with zero setup.
            signingConfig = releaseKeystore ? signingConfigs.getByName("release")
                                            : signingConfigs.getByName("debug")
            // R8 code + resource shrinking. Verify the BLE flow on-device after any keep-rule
            // change (this app has no reflection/serialization, so the risk is low).
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
kotlin {
    jvmToolchain(25)
}
dependencies {
    implementation platform("androidx.compose:compose-bom:2026.09.00")
    implementation "androidx.core:core-ktx:1.19.0"
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.11.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
    testImplementation "junit:junit:4.13.2"
}
